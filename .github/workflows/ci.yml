name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    container: docker.io/library/debian:13-slim
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang-22 clang-format cmake ninja-build git ca-certificates \
            pkgconf zlib1g-dev liblzo2-dev libexpat1-dev libfontconfig-dev libgl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - uses: actions/checkout@v4

      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('vendor/*.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_BASE_DIR="$PWD/.deps"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # clang-cl and lld-link from the Visual Studio installation, with the Windows SDK on the path.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-windows-${{ hashFiles('vendor/*.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER=lld-link -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
